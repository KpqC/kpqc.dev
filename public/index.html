<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="go-import" content="kpqc.dev git https://github.com/KpqC/kpqc-go">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KpqC post-quantum cryptography libraries">
  <title>KpqC</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(36rem, calc(100% - 3rem));
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: clamp(2.5rem, 10vw, 5rem);
      letter-spacing: -0.05em;
    }

    p {
      margin: 0 0 1.5rem;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    nav {
      display: flex;
      gap: 1.25rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>KpqC</h1>
    <p>Post-quantum cryptography libraries for developers.</p>
    <nav aria-label="Project links">
      <a href="https://pkg.go.dev/kpqc.dev">Go package</a>
      <a href="https://github.com/KpqC">GitHub</a>
    </nav>
  </main>
</body>
</html>
